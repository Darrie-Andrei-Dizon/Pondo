<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Pondo</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Pondo: a private money tracker for cash, e-wallets and bank accounts.">
<meta name="theme-color" content="#0E1420">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Pondo">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&display=swap">
<style>
/* Layout: one scrolling column; banknote hero with a payday runway; floating glass tab bar; bottom sheets for every form. */
:root{
  --ink:#0A101B;        /* page: deep navy, the ₱1000 note at night */
  --surface:#121A28;    /* cards and lists */
  --raise:#1A2436;      /* inputs, keys, chips */
  --raise-2:#24314A;    /* pressed, future runway days */
  --line:rgba(150,170,210,.09);
  --hi:inset 0 1px 0 rgba(255,255,255,.045);
  --text:#ECEFF6;
  --muted:#8A96AC;
  --dim:#5A667C;
  --gold:#F2C14E;       /* accent: ₱500 yellow */
  --gold-soft:rgba(242,193,78,.13);
  --gold-ink:#241A03;
  --mint:#5FD3A0;       /* money in */
  --coral:#F27A64;      /* over, overdue, short */
  --serif:"DM Serif Display", Georgia, "Times New Roman", serif;
  --sans:-apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, "Segoe UI", Roboto, sans-serif;
  --ease:cubic-bezier(.2,.8,.2,1);
  color-scheme:dark;
}
html{background:var(--ink);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);-webkit-text-size-adjust:100%}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:radial-gradient(120% 420px at 50% -120px,#17233A 0%,var(--ink) 70%) no-repeat,var(--ink);color:var(--text);font:15px/1.4 var(--sans);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));-webkit-tap-highlight-color:transparent;overflow-x:hidden;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--ink);z-index:10}
body.locked{overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;touch-action:manipulation;text-align:inherit;-webkit-user-select:none;user-select:none}
button:disabled{cursor:default}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
[hidden]{display:none!important}
.num{font-variant-numeric:tabular-nums}
.pos{color:var(--mint)} .muted{color:var(--muted)} .bad{color:var(--coral)}

/* press feedback */
.tx,.wallet,.chip,.key,.btn,.pill-btn,.cat,.srow,.note,.brow,.cd,.tab,.add-btn,.notice button,.link,.month button{transition:transform .14s var(--ease),background-color .14s,opacity .14s}
.tx:active,.srow:active,.brow:active{background:rgba(255,255,255,.035)}
.wallet:active,.chip:active,.key:active,.btn:active,.pill-btn:active,.cat:active,.cd:active,.add-btn:active{transform:scale(.95)}
.note:active{transform:scale(.985)}
.tab:active{opacity:.6}

.wrap{max-width:520px;margin:0 auto;padding-bottom:calc(112px + env(safe-area-inset-bottom,0px))}
.wrap.enter{animation:enter .34s var(--ease) both}
@keyframes enter{from{opacity:.35;transform:translateY(8px)}}

/* header */
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding-block:16px 14px;margin-bottom:2px}
.eyebrow{color:var(--muted);font-size:13px;margin-bottom:3px}
.title{font-family:var(--serif);font-weight:400;font-size:32px;line-height:1.04;margin:0;letter-spacing:-.005em;text-wrap:balance}
.badge-mark{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;color:var(--gold);background:linear-gradient(160deg,#1E2A42,#131B2A);border:1px solid rgba(242,193,78,.25);flex:none}
.badge-mark svg{width:24px;height:24px}

.section{margin-top:30px}
.sec-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:11px;padding-inline:2px}
.sec-title{font-size:17px;font-weight:650;margin:0;letter-spacing:-.01em}
.sec-aside{color:var(--muted);font-size:14px}
.link{color:var(--gold);font-size:14.5px;font-weight:600}

/* notices */
.notices{display:grid;gap:8px;margin-bottom:14px}
.notice{display:flex;align-items:center;gap:10px;padding:10px 12px 10px 14px;border-radius:14px;background:var(--surface);box-shadow:var(--hi);font-size:13.5px;color:var(--muted)}
.notice::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--gold);flex:none}
.notice span{flex:1;min-width:0}
.notice button{color:var(--gold);font-weight:650;flex:none;padding:4px 2px}

/* banknote hero */
.note{display:block;width:100%;position:relative;overflow:hidden;isolation:isolate;border-radius:28px;padding:20px 20px 0;background:linear-gradient(158deg,#22304C 0%,#172036 46%,#111827 100%);border:1px solid rgba(242,193,78,.30);box-shadow:0 24px 50px -24px rgba(0,0,0,.7),inset 0 1px 0 rgba(255,255,255,.07)}
.note::before{content:"";position:absolute;inset:-35%;z-index:-1;background:repeating-radial-gradient(circle at 80% 26%,rgba(242,193,78,.12) 0 1px,transparent 1.6px 8px);-webkit-mask-image:radial-gradient(circle at 80% 26%,#000 0 18%,transparent 46%);mask-image:radial-gradient(circle at 80% 26%,#000 0 18%,transparent 46%)}
.note::after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.035) 45%,transparent 60%)}
.note.is-bad{border-color:rgba(242,122,100,.4)}
.note-top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.note-label{font-size:14px;color:#AEB8CB}
.note-info{color:var(--dim);display:grid}
.note-info svg{width:19px;height:19px}
.note-big{display:flex;align-items:flex-start;gap:4px;margin:10px 0 6px;color:var(--gold);line-height:.95}
.note.is-bad .note-big{color:var(--coral)}
.note-big .sym{font:500 26px/1 var(--sans);margin-top:9px;opacity:.85}
.note-big .amt{font-family:var(--serif);font-size:66px;letter-spacing:-.015em;overflow-wrap:anywhere}
.note-of{font-size:14px;color:#C5CDDC}
.note-of .num{color:var(--text);font-weight:600}
.runway{position:relative;height:46px;display:flex;align-items:flex-end;gap:3px;margin:20px 0 6px}
.rb{flex:1;min-width:2px;border-radius:3px;background:rgba(242,193,78,.5);min-height:4px}
.rb.over{background:rgba(242,122,100,.75)}
.rb.today{background:var(--gold);box-shadow:0 0 0 2px rgba(242,193,78,.25)}
.rb.future{height:4px;background:var(--raise-2)}
.rw-line{position:absolute;left:0;right:0;border-top:1px dashed rgba(236,239,246,.32)}
.rw-lbl{display:flex;justify-content:space-between;font-size:11.5px;color:var(--muted);margin-bottom:16px}
.note-foot{display:grid;grid-template-columns:1fr 1fr;border-top:1px dashed rgba(242,193,78,.26);margin:0 -20px}
.note-foot>div{padding:13px 20px 15px;min-width:0}
.note-foot>div+div{border-left:1px dashed rgba(242,193,78,.26)}
.nf-v{font-size:17px;font-weight:650;overflow-wrap:anywhere}
.nf-l{font-size:12.5px;color:var(--muted);margin-top:1px}

/* wallets */
.wallets{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;margin-inline:-16px;padding:2px 16px 6px;scrollbar-width:none;scroll-padding-inline:16px}
.wallets::-webkit-scrollbar,.chips::-webkit-scrollbar,.filters::-webkit-scrollbar{display:none}
.wallet{flex:0 0 auto;width:148px;scroll-snap-align:start;background:var(--surface);box-shadow:var(--hi);border-radius:20px;padding:14px;display:flex;flex-direction:column;gap:2px}
.w-ic{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;font-size:17px;background:var(--raise);margin-bottom:10px}
.w-name{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.w-bal{font-size:18px;font-weight:650;white-space:nowrap;letter-spacing:-.01em}
.w-tag{font-size:11.5px;color:var(--dim)}
.wallet.add{align-items:center;justify-content:center;width:72px;color:var(--muted);font-size:26px;background:transparent;box-shadow:inset 0 0 0 1.5px var(--line)}

/* lists */
.list{background:var(--surface);box-shadow:var(--hi);border-radius:20px;overflow:hidden}
.tx{display:flex;align-items:center;gap:12px;width:100%;padding:12px 14px;position:relative}
.list>*+*::before{content:"";position:absolute;top:0;left:66px;right:0;border-top:1px solid var(--line)}
.list>*{position:relative}
.ic{--c:#8FA0B8;width:40px;height:40px;border-radius:13px;display:grid;place-items:center;font-size:19px;flex:none;background:var(--raise);background:color-mix(in srgb,var(--c) 20%,var(--surface))}
.tx-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.tx-title{font-weight:550;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx-sub{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx-time{color:var(--dim);font-variant-numeric:tabular-nums;margin-right:8px}
.tx-right{display:flex;flex-direction:column;align-items:flex-end;flex:none;gap:1px;max-width:48%}
.tx-amt{font-weight:650;white-space:nowrap}
.pill-btn{flex:none;background:var(--gold-soft);color:var(--gold);border-radius:999px;padding:8px 16px;font-weight:650;font-size:14px}
.datebadge{width:40px;height:44px;border-radius:12px;background:var(--raise);display:flex;flex-direction:column;align-items:center;justify-content:center;flex:none;line-height:1}
.datebadge small{font-size:10.5px;color:var(--muted);margin-bottom:3px}
.datebadge b{font-size:17px;font-weight:700}
.datebadge.bad{background:rgba(242,122,100,.14)}
.datebadge.bad small,.datebadge.bad b{color:var(--coral)}
.empty{padding:28px 20px;text-align:center;color:var(--muted);display:flex;flex-direction:column;gap:14px;align-items:center;line-height:1.5}
.day{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin:22px 6px 8px}
.day:first-child{margin-top:4px}

/* month switch + stats */
.month{display:flex;align-items:center;justify-content:space-between;background:var(--surface);box-shadow:var(--hi);border-radius:16px;padding:4px}
.month button{width:44px;height:38px;border-radius:12px;display:grid;place-items:center;color:var(--text)}
.month button:active{background:var(--raise)}
.month button:disabled{opacity:.22}
.month button svg{width:18px;height:18px}
.month b{font-weight:650}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.stat{background:var(--surface);box-shadow:var(--hi);border-radius:16px;padding:11px 12px;min-width:0}
.stat .v{font-weight:650;font-size:15px;overflow-wrap:anywhere}
.stat .l{font-size:12px;color:var(--muted)}

/* calendar */
.cal{background:var(--surface);box-shadow:var(--hi);border-radius:20px;padding:12px 12px 14px;margin-top:10px}
.cal-week,.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.cal-week span{text-align:center;font-size:11px;color:var(--dim);padding-bottom:4px}
.cd{aspect-ratio:1;max-width:100%;border-radius:10px;font-size:12.5px;font-weight:600;display:grid;place-items:center;color:var(--text);background:var(--raise);background:color-mix(in oklch shorter hue,var(--gold) var(--p,0%),#1C2A44)}
.cd.none{color:var(--dim);background:var(--raise)}
.cd.hot{color:var(--gold-ink)}
.cd.fut{background:transparent;color:var(--dim);box-shadow:inset 0 0 0 1px var(--line)}
.cd.is-today{box-shadow:inset 0 0 0 2px var(--text)}
.cd[aria-pressed="true"]{outline:2px solid var(--gold);outline-offset:2px}
.cal-key{display:flex;justify-content:space-between;align-items:center;font-size:11.5px;color:var(--muted);margin-top:10px;padding-inline:2px}
.cal-scale{display:flex;gap:3px;align-items:center}
.cal-scale i{width:12px;height:12px;border-radius:4px;display:inline-block}
.filters{display:flex;gap:8px;margin-top:14px;overflow-x:auto;scrollbar-width:none;margin-inline:-16px;padding-inline:16px}
.search{margin-top:10px}

/* budget */
.spent-card{background:var(--surface);box-shadow:var(--hi);border-radius:24px;padding:18px 16px 14px;margin-top:10px}
.spent-big{display:flex;align-items:flex-start;gap:3px;line-height:1}
.spent-big .sym{font:500 20px/1 var(--sans);color:var(--muted);margin-top:6px}
.spent-big .amt{font-family:var(--serif);font-size:46px;letter-spacing:-.01em}
.spent-cmp{font-size:13.5px;color:var(--muted);margin-top:8px}
.stack{display:flex;gap:2px;height:12px;border-radius:6px;overflow:hidden;margin-top:16px;background:var(--raise)}
.stack i{background:var(--c);min-width:3px}
.stack-legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:10px;font-size:12.5px;color:var(--muted)}
.stack-legend span{display:flex;align-items:center;gap:6px}
.stack-legend i{width:8px;height:8px;border-radius:50%;background:var(--c);display:inline-block}
.stack-legend b{color:var(--text);font-weight:600}
.plan-card{background:var(--surface);box-shadow:var(--hi);border-radius:24px;padding:16px;margin-top:10px}
.plan-empty{display:flex;align-items:center;gap:14px;justify-content:space-between}
.plan-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.plan-title{font-family:var(--serif);font-size:23px;line-height:1.15}
.plan-sub{font-size:13px;color:var(--muted);margin-top:3px;line-height:1.45}
.pg{padding-top:14px}
.pg+.pg{border-top:1px solid var(--line);margin-top:14px}
.pg-top{display:flex;justify-content:space-between;gap:12px;font-size:14.5px;font-weight:600}
.pg-name{display:flex;align-items:center;gap:8px}
.pg-name i{width:9px;height:9px;border-radius:50%;background:var(--c);flex:none}
.pg-name .muted{font-weight:500}
.pg .bar{margin:10px 0 0}
.pg-sub{font-size:12.5px;color:var(--muted);margin-top:7px}
.rules{display:grid;gap:8px;margin-bottom:16px}
.rule{display:flex;flex-direction:column;gap:3px;padding:13px 14px;border-radius:16px;background:var(--raise);border:1.5px solid transparent;text-align:left;transition:transform .14s var(--ease),background-color .18s,border-color .18s}
.rule:active{transform:scale(.98)}
.rule[aria-pressed="true"]{border-color:var(--gold);background:var(--raise-2)}
.rule-name{font-weight:650;font-size:15.5px}
.rule-desc{font-size:13px;color:var(--muted);line-height:1.4}
.rule-bar{display:flex;gap:2px;height:6px;border-radius:3px;overflow:hidden;margin-top:8px}
.rule-bar i{background:var(--c)}
.three{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.seg-sm{flex:none}
.seg-sm button{padding:6px 7px;font-size:12px}
.preview{background:var(--raise);border-radius:16px;padding:4px 14px;margin:2px 0 16px}
.preview div{display:flex;justify-content:space-between;gap:12px;padding:10px 0}
.preview div+div{border-top:1px dashed rgba(150,170,210,.16)}
.preview span{display:flex;align-items:center;gap:8px;color:var(--muted)}
.preview i{width:9px;height:9px;border-radius:50%;background:var(--c);flex:none}
/* header actions + quote */
.top-actions{display:flex;gap:8px;align-items:center;flex:none}
.icon-btn{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;color:var(--muted);background:var(--surface);box-shadow:var(--hi);transition:transform .14s var(--ease)}
.icon-btn:active{transform:scale(.92)}
.icon-btn svg{width:21px;height:21px}
.done-btn{color:var(--gold);font-weight:650;padding:8px 4px}
.quote{display:block;width:100%;text-align:left;padding:0 2px;margin:0 0 20px}
.q-text{display:block;font-family:var(--serif);font-size:19.5px;line-height:1.32;color:#D3DAE7;text-wrap:pretty}
.q-text::before{content:"\201C";color:var(--gold)}
.q-text::after{content:"\201D";color:var(--gold)}
.q-trans{display:block;font-size:13.5px;color:var(--muted);margin-top:5px;font-style:italic;line-height:1.4}
.q-by{display:block;font-size:12.5px;color:var(--dim);margin-top:6px}
.quote.swap .q-text,.quote.swap .q-trans{animation:qfade .4s var(--ease)}
@keyframes qfade{from{opacity:0;transform:translateY(4px)}}
.qa-hint{text-align:center;font-size:13px;color:var(--muted);margin:-6px 0 12px}
.qa-hint.bad{color:var(--coral)}

/* utang */
.owe-sum{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.owe-card{background:var(--surface);box-shadow:var(--hi);border-radius:20px;padding:14px;min-width:0}
.owe-card .l{font-size:12.5px;color:var(--muted)}
.owe-card .v{font-family:var(--serif);font-size:30px;line-height:1.1;margin:6px 0 2px;overflow-wrap:anywhere}
.owe-card.in .v{color:var(--mint)}
.owe-card.out .v{color:var(--coral)}
.person{margin-top:22px}
.person-head{display:flex;align-items:center;gap:12px;padding:0 4px 10px}
.person-head .tx-right{font-size:14px;font-weight:600}
.av{--c:#8FA0B8;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:16px;flex:none;color:var(--c);background:var(--raise);background:color-mix(in srgb,var(--c) 18%,var(--surface))}
.ulist>*+*::before{left:14px!important}
.mini-bar{display:block;height:4px;border-radius:2px;background:var(--raise);margin-top:7px;max-width:140px;overflow:hidden}
.mini-bar i{display:block;height:100%;background:var(--mint);border-radius:inherit}
.people{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
.add-person{display:grid;grid-template-columns:1fr auto;gap:8px;margin-bottom:12px}
.add-person .btn{min-height:48px;width:auto;padding:0 18px}
.split-note{background:var(--raise);border-radius:16px;padding:12px 14px;margin:2px 0 14px;font-size:14px;line-height:1.5;color:var(--muted)}
.split-note b{color:var(--text)}
.msg-box{background:var(--raise);border-radius:16px;padding:12px 14px;font-size:14px;line-height:1.5;margin-bottom:10px;-webkit-user-select:text;user-select:text}
.pay-list{font-size:13px;color:var(--muted);margin:-6px 2px 14px;display:grid;gap:4px}
.pay-list div{display:flex;justify-content:space-between;gap:12px}
.seg-4 button{font-size:13px;padding:8px 2px}
.sec-note{font-size:13.5px;color:var(--muted);line-height:1.5;margin:-4px 4px 12px}
.sec-note b{color:var(--text)}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--surface);box-shadow:var(--hi);border-radius:20px;padding:14px;min-width:0}
.tile-v{font-family:var(--serif);font-size:26px;line-height:1.1;overflow-wrap:anywhere}
.tile-l{font-size:12.5px;color:var(--muted);margin-top:3px}
.tile-s{font-size:12.5px;margin-top:8px;line-height:1.35}
.em-card,.extra-card{display:block;width:100%;background:var(--surface);box-shadow:var(--hi);border-radius:24px;padding:16px;transition:transform .14s var(--ease)}
.em-card:active,.extra-card:active{transform:scale(.985)}
.em-top{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.em-title{font-family:var(--serif);font-size:23px}
.em-big{font-size:20px;font-weight:700;color:var(--mint)}
.em-big small{font-size:13px;color:var(--muted);font-weight:500}
.extra-card{display:flex;align-items:center;gap:14px;background:linear-gradient(150deg,#1E2A42,#141B2A);border:1px solid rgba(242,193,78,.25)}
.bucket{display:grid;grid-template-columns:1fr auto;grid-template-areas:"name step" "name amt";gap:4px 12px;align-items:center;padding:12px 14px;position:relative}
.bucket .pg-name{grid-area:name;align-items:flex-start}
.bucket .pg-name i{margin-top:6px}
.stepper{grid-area:step;display:flex;align-items:center;gap:4px;justify-self:end}
.stepper button{width:32px;height:32px;border-radius:10px;background:var(--raise);font-size:18px;font-weight:600;display:grid;place-items:center}
.stepper button:active{background:var(--raise-2)}
.stepper b{min-width:42px;text-align:center;font-size:15px}
.bucket-amt{grid-area:amt;justify-self:end;font-size:13px;color:var(--muted)}
.qa-tagchip{border-color:rgba(242,193,78,.7)}
.nw-parts{display:flex;flex-wrap:wrap;gap:4px 16px;font-size:12.5px;color:var(--muted);margin-top:10px}
.nw-parts b{color:var(--text);font-weight:600}

function balances(upTo = null) {

  for (const t of S.txs) {
    if (upTo && t.date > upTo) continue;
    if (t.type === 'exp') b[t.wallet] = (b[t.wallet] || 0) - t.amt;
    else if (t.type === 'inc') b[t.wallet] = (b[t.wallet] || 0) + t.amt;
    else if (t.type === 'debt' || t.type === 'inv' || t.type === 'adj') b[t.wallet] = (b[t.wallet] || 0) + (t.dir === 'in' ? t.amt : -t.amt);

function groupedList(rows) {

function runway(s) {
  const start = prevPayday(), t = today(), end = ymd(s.next);

  if (days.length > 31) days = days.slice(-31);
  if (!days.length) return '';
  const ids = new Set(s.spendW.map(w => w.id)), spend = {};
  for (const x of S.txs) if (x.type === 'exp' && !x.billId && ids.has(x.wallet) && x.date >= days[0] && x.date <= t) spend[x.date] = (spend[x.date] || 0) + x.amt;
  const pastMax = Math.max(0, ...days.filter(d => d <= t).map(d => spend[d] || 0));
  const ref = Math.max(pastMax * 1.15, Math.min(s.perDay, pastMax * 3) * 1.1, 1);
  const line = s.perDay > 0 && s.perDay <= ref ? s.perDay / ref * 100 : null;
  const bars = days.map(d => {
    if (d > t) return '<i class="rb future"></i>';
    const v = spend[d] || 0, h = Math.max(7, v / ref * 100);
    const cls = d === t ? 'today' : (s.perDay > 0 && v > s.perDay ? 'over' : 'past');
    return `<i class="rb ${cls}" style="height:${h.toFixed(1)}%"></i>`;
  }).join('');
  return `<div class="runway" aria-hidden="true">${line !== null ? `<span class="rw-line" style="bottom:${line.toFixed(1)}%"></span>` : ''}${bars}</div>
    <div class="rw-lbl"><span>${isAllowance() ? 'Got allowance' : 'Paid'} ${esc(monthDay(start))}</span><span>${esc(monthDay(s.next))}</span></div>`;
}

function monthSwitch() {

function calendar() {

function paceChart(ym) {
  const [y, m] = ym.split('-').map(Number);
  const n = daysIn(y, m - 1), isCur = ym === ymOf(today()), upto = isCur ? todayD().getDate() : n;
  const pym = addMonths(ym, -1), [py, pm] = pym.split('-').map(Number), pn = daysIn(py, pm - 1);
  const cum = (ymX, nX) => { const a = new Array(nX + 1).fill(0); monthTx(ymX).forEach(t => { if (t.type === 'exp') a[+t.date.slice(8)] += t.amt; }); for (let i = 1; i <= nX; i++) a[i] += a[i - 1]; return a; };
  const cur = cum(ym, n).slice(0, upto + 1), prev = cum(pym, pn);
  const max = Math.max(1, cur[upto], prev[pn]) * 1.12;
  const W = 340, H = 168, B = 24, T = 10, span = Math.max(n, pn) - 1;
  const x = d => 6 + (d - 1) / span * (W - 12), yv = v => H - B - v / max * (H - B - T);
  const line = (arr, last) => { let p = ''; for (let d = 1; d <= last; d++) p += `${d === 1 ? 'M' : 'L'}${x(d).toFixed(1)} ${yv(arr[d]).toFixed(1)}`; return p; };
  const curPath = line(cur, upto), prevPath = line(prev, pn);
  const area = `${curPath}L${x(upto).toFixed(1)} ${H - B}L${x(1).toFixed(1)} ${H - B}Z`;
  const ex = x(upto), ey = yv(cur[upto]);
  const mShort = s => parseD(s + '-01').toLocaleDateString('en-US', { month: 'short' });
  const compact = v => v >= 100000000 ? (v / 100000000).toFixed(1) + 'M' : v >= 100000 ? (v / 100000).toFixed(v >= 1000000 ? 0 : 1).replace('.0', '') + 'k' : String(Math.round(v / 100));
  const gridVals = [0.5, 1].map(f => max / 1.12 * f);
  return `<div class="chart-card"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Running total of spending this month compared with last month">
    <defs><linearGradient id="pf" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#F2C14E" stop-opacity=".32"/><stop offset="1" stop-color="#F2C14E" stop-opacity="0"/></linearGradient></defs>
    ${gridVals.map(v => `<line x1="0" x2="${W}" y1="${yv(v).toFixed(1)}" y2="${yv(v).toFixed(1)}" stroke="rgba(150,170,210,.08)"/><text class="c-lbl" x="${W}" y="${(yv(v) - 5).toFixed(1)}" text-anchor="end">${compact(v)}</text>`).join('')}
    <line x1="0" x2="${W}" y1="${H - B}" y2="${H - B}" stroke="rgba(150,170,210,.14)"/>
    <path d="${prevPath}" fill="none" stroke="#5A667C" stroke-width="1.8" stroke-dasharray="4 4" stroke-linejoin="round"/>
    <path d="${area}" fill="url(#pf)"/>
    <path d="${curPath}" fill="none" stroke="#F2C14E" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="${ex.toFixed(1)}" cy="${ey.toFixed(1)}" r="7" fill="#F2C14E" fill-opacity=".22"/><circle cx="${ex.toFixed(1)}" cy="${ey.toFixed(1)}" r="3.6" fill="#F2C14E"/>
    ${[1, 15, n].map((d, i) => `<text class="c-lbl" x="${x(d).toFixed(1)}" y="${H - 6}" text-anchor="${i === 0 ? 'start' : i === 2 ? 'end' : 'middle'}">${mShort(ym)} ${d}</text>`).join('')}
  </svg>
  <div class="chart-legend"><span><i></i>${esc(parseD(ym + '-01').toLocaleDateString('en-US', { month: 'long' }))}</span><span><i class="prev"></i>${esc(parseD(pym + '-01').toLocaleDateString('en-US', { month: 'long' }))}</span></div></div>`;
}
function vBudget() {
  const mt = monthTx(ui.month).filter(t => t.type === 'exp');

  const by = {};
  mt.forEach(t => by[t.cat] = (by[t.cat] || 0) + t.amt);
  const expCats = S.cats.filter(c => c.type === 'exp');
  const isCur = ui.month === ymOf(today());
  const td = todayD();

  const prevTo = monthTx(pym).filter(t => t.type === 'exp' && +t.date.slice(8) <= cut).reduce((a, t) => a + t.amt, 0);
  const diff = total - prevTo;
  const cmp = prevTo ? `<span class="${diff <= 0 ? 'pos' : 'bad'} num">${money(Math.abs(diff))} ${diff <= 0 ? 'less' : 'more'}</span> than ${isCur ? 'this point in ' : ''}${esc(monthName(pym))}` : '';

  const sorted = Object.entries(by).sort((a, b) => b[1] - a[1]);

  const legend = sorted.slice(0, 4).map(([id, v]) => `<span><i style="--c:${cat(id)?.color || '#8FA0B8'}"></i>${esc(cat(id)?.name || 'Other')} <b>${Math.round(v / total * 100)}%</b></span>`).join('');

  const head = total ? `<div class="spent-card">

    </div>` : `<div class="list" style="margin-top:10px"><div class="empty">No spending logged in ${monthLabel(ui.month)}.</div></div>`;

  const info = planInfo(ui.month);
  const budgeted = expCats.reduce((a, c) => a + budgetOf(c, info), 0);
  const budgetedSpent = expCats.filter(c => budgetOf(c, info)).reduce((a, c) => a + (by[c.id] || 0), 0);
  const rank = c => (by[c.id] || 0) + (budgetOf(c, info) ? 1e12 : 0);
  const rows = [...expCats].sort((a, b) => rank(b) - rank(a)).map(c => {
    const sp = by[c.id] || 0, bud = budgetOf(c, info), overB = bud && sp > bud;

        <span class="tx-right">${right}</span></div>

    </button>`;

  const months = [];

  const bars = months.map((m, i) => {

    return `<rect x="${x}" y="${y}" width="${bw}" height="${h}" rx="8" fill="${curr ? '#F2C14E' : '#24314A'}"/>
      <text class="c-lbl" x="${x + bw / 2}" y="${H - 7}" text-anchor="middle">${lbl}</text>
      ${m.v ? `<text class="${curr ? 'c-val' : 'c-lbl'}" x="${x + bw / 2}" y="${y - 7}" text-anchor="middle">${compact(m.v)}</text>` : ''}`;
  }).join('');

  return `${planHeader()}
    ${monthSwitch()}

/* ---------- pay schedule (salary or allowance) ---------- */
const WEEKDAYS = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
const isAllowance = () => S.earner === 'allowance';
const nextPayWord = () => isAllowance() ? 'next allowance' : 'payday';
const eachPay = () => isAllowance() ? 'each allowance' : 'each payday';
function payAfter(d0) {
  const sc = S.schedule, d = new Date(d0); d.setHours(0, 0, 0, 0);
  if (sc.type === 'daily') { d.setDate(d.getDate() + 1); return d; }
  if (sc.type === 'weekly') { do d.setDate(d.getDate() + 1); while (d.getDay() !== sc.weekday); return d; }
  if (sc.type === 'biweekly') {
    const a = parseD(sc.anchor), diff = Math.round((d - a) / 864e5), k = Math.floor(diff / 14) + 1;
    return new Date(a.getFullYear(), a.getMonth(), a.getDate() + k * 14);
  }
  const days = [...new Set(sc.days)].sort((a, b) => a - b);
  for (let i = 0; i < 3; i++) {
    const base = new Date(d.getFullYear(), d.getMonth() + i, 1), y = base.getFullYear(), m = base.getMonth(), last = daysIn(y, m);
    for (const x of days) { const dt = new Date(y, m, Math.min(x, last)); if (dt > d) return dt; }
  }
  return new Date(d.getFullYear(), d.getMonth() + 1, 1);
}
function payOnOrBefore(d0) {
  const sc = S.schedule, d = new Date(d0); d.setHours(0, 0, 0, 0);
  if (sc.type === 'daily') return d;
  if (sc.type === 'weekly') { while (d.getDay() !== sc.weekday) d.setDate(d.getDate() - 1); return d; }
  if (sc.type === 'biweekly') {
    const a = parseD(sc.anchor), diff = Math.round((d - a) / 864e5), k = Math.floor(diff / 14);
    return new Date(a.getFullYear(), a.getMonth(), a.getDate() + k * 14);
  }
  const days = [...new Set(sc.days)].sort((a, b) => b - a);
  for (let i = 0; i < 3; i++) {
    const base = new Date(d.getFullYear(), d.getMonth() - i, 1), y = base.getFullYear(), m = base.getMonth(), last = daysIn(y, m);
    for (const x of days) { const dt = new Date(y, m, Math.min(x, last)); if (dt <= d) return dt; }
  }
  return new Date(d.getFullYear(), d.getMonth() - 1, d.getDate());
}
function nextPayday() { return payAfter(todayD()); }
function prevPayday() { return payOnOrBefore(todayD()); }
function paysUntil(dateStr) {
  const end = parseD(dateStr); let n = 0, d = todayD();
  for (let i = 0; i < 1200; i++) { d = payAfter(d); if (d > end) break; n++; }
  return Math.max(1, n);
}
function scheduleText(sc = S.schedule) {
  if (sc.type === 'daily') return 'Every day';
  if (sc.type === 'weekly') return `Every ${WEEKDAYS[sc.weekday]}`;
  if (sc.type === 'biweekly') return `Every other ${WEEKDAYS[parseD(sc.anchor).getDay()]}`;
  const d = [...sc.days].sort((a, b) => a - b).map(ordinal);
  return d.length > 1 ? d.slice(0, -1).join(', ') + ' and ' + d[d.length - 1] : 'Every ' + d[0];
}
function schState(src) {
  const sc = src.schedule;
  return { earner: src.earner || 'salary', type: sc.type, days: (sc.days || [15, 30]).join(', '), weekday: sc.weekday ?? 1, anchor: sc.anchor || today() };
}
function schFields(st) {
  const b = (act, v, cur, l) => `<button data-act="${act}" data-v="${v}" aria-pressed="${cur === v}">${l}</button>`;
  let detail = '';
  if (st.type === 'monthly') detail = `<label class="field"><span>${st.earner === 'allowance' ? 'Days you get it' : 'Paydays'}</span><input class="input" id="sch-days" value="${esc(st.days)}" inputmode="numeric" autocomplete="off"><span class="hint">Days of the month, separated by commas, like 15, 30. Use 30 for the last day.</span></label>`;
  else if (st.type === 'weekly') detail = `<label class="field"><span>Which day?</span><select class="input" id="sch-weekday">${WEEKDAYS.map((w, i) => `<option value="${i}" ${st.weekday === i ? 'selected' : ''}>${w}</option>`).join('')}</select></label>`;
  else if (st.type === 'biweekly') detail = `<label class="field"><span>Date of your last or next one</span><input class="input" id="sch-anchor" type="date" value="${st.anchor}"><span class="hint">Pondo counts every 2 weeks from this date.</span></label>`;

function schBuild(st) {

/* ---------- pots: savings goals and yearly costs ---------- */
const POT_ICONS = ['💻', '📱', '✈️', '🎓', '🎒', '🎄', '🎁', '🏍️', '🏠', '💍', '🩺', '🧾', '🎮', '📚', '🚗', '🐷'];
const potSaved = p => p.adds.reduce((a, x) => a + x.amt, 0);
function potDue(p) {

const daysTo = ds => Math.round((parseD(ds) - todayD()) / 864e5);

/* ---------- weekly recap and no-spend streak ---------- */
function weekStartOf(d) { const x = new Date(d); x.setHours(0, 0, 0, 0); x.setDate(x.getDate() - (x.getDay() + 6) % 7); return x; }
function rangeStats(from, to) {
  const tx = S.txs.filter(t => t.date >= from && t.date <= to);
  const exp = tx.filter(t => t.type === 'exp');
  const by = {}; exp.forEach(t => by[t.cat] = (by[t.cat] || 0) + t.amt);

}

}

const numParse = v => { const n = parseFloat(String(v ?? '').replace(/[^0-9.]/g, '')); return isFinite(n) ? n : NaN; };

const pct1 = v => `${v >= 0 ? '+' : '−'}${Math.abs(v).toFixed(1)}%`;
const tradeCash = t => t.type === 'buy' ? Math.round(t.qty * t.price * 100) + (t.fees || 0) : t.type === 'sell' ? Math.round(t.qty * t.price * 100) - (t.fees || 0) : t.amt;
// Average-cost method: selling takes out shares at your average cost so far.
function holdingStats(h, upTo = null) {

}
function portfolio() {
  const hs = S.holdings.map(h => ({ h, s: holdingStats(h) }));
  const sum = k => hs.reduce((a, x) => a + x.s[k], 0);
  const cost = sum('cost'), value = sum('value');
  return { hs, cost, value, gain: value - cost, pct: cost ? (value - cost) / cost * 100 : 0, realized: sum('realized'), divs: sum('divs') };
}

  const inv = S.holdings.reduce((a, h) => { const s = holdingStats(h, date); return a + (date ? s.cost : s.value); }, 0);
  const left = d => d.amt - d.paid.filter(p => !date || p.date <= date).reduce((a, p) => a + p.amt, 0);
  const ds = S.debts.filter(d => !date || d.date <= date);
  const owedToMe = ds.filter(d => d.dir === 'owed').reduce((a, d) => a + Math.max(0, left(d)), 0);
  const iOwe = ds.filter(d => d.dir === 'owe').reduce((a, d) => a + Math.max(0, left(d)), 0);

const investedIn = (from, to) => S.holdings.reduce((a, h) => a + h.trades.filter(t => t.type === 'buy' && t.date >= from && t.date <= to).reduce((x, t) => x + tradeCash(t), 0), 0);

function nwChart() {

const APPS_SCRIPT = "/**\n * Pondo backup script\n * Paste this into Extensions > Apps Script of a Google Sheet, then deploy it as a web app.\n * Full steps are in SHEETS-SETUP.md.\n *\n * Replace the text between the quotes with the secret code shown in\n * Pondo > Settings > Google Sheets backup. Keep the quotes.\n */\nconst SECRET = 'PASTE-YOUR-SECRET-HERE';\n\nconst RAW = 'Pondo backup';\nconst PREV = 'Pondo backup (previous)';\nconst CHUNK = 40000; // a Google Sheets cell holds up to 50,000 characters\n\nfunction doPost(e) {\n  let req;\n  try { req = JSON.parse(e.postData.contents); } catch (err) { return out({ ok: false, error: 'bad-request' }); }\n  if (!req || SECRET === 'PASTE-YOUR-SECRET-HERE' || req.secret !== SECRET) return out({ ok: false, error: 'wrong-secret' });\n  const ss = SpreadsheetApp.getActiveSpreadsheet();\n\n  if (req.action === 'ping') return out({ ok: true, info: info(ss) });\n\n  if (req.action === 'restore') {\n    const raw = readRaw(ss, req.previous ? PREV : RAW);\n    return out(raw ? { ok: true, data: raw, info: info(ss) } : { ok: false, error: 'no-backup' });\n  }\n\n  if (req.action === 'backup') {\n    const lock = LockService.getScriptLock();\n    lock.waitLock(20000);\n    try {\n      const cur = info(ss);\n      // Refuse to replace a backup with much less data unless Pondo asked the user first.\n      if (!req.force && cur.txCount > 0 && Number(req.txCount) < cur.txCount * 0.5) return out({ ok: false, error: 'smaller', info: cur });\n      copySheet(ss, RAW, PREV);\n      writeRaw(ss, RAW, String(req.data || ''), req.meta || {});\n      (req.tables || []).forEach(function (t) { writeTable(ss, t.name, t.rows || []); });\n      return out({ ok: true, info: info(ss) });\n    } finally {\n      lock.releaseLock();\n    }\n  }\n  return out({ ok: false, error: 'unknown-action' });\n}\n\nfunction doGet() { return out({ ok: true, app: 'pondo' }); }\n\nfunction out(o) {\n  return ContentService.createTextOutput(JSON.stringify(o)).se /* ---------- sheets ---------- */
let sheetState = null;
function openSheet(html, opts = {}) {
  const root = $('#sheet-root');
  root.innerHTML = `<div class="scrim" ${opts.locked ? '' : 'data-act="closeSheet"'}></div><div class="sheet" role="dialog" aria-modal="true">${opts.locked ? '' : '<div class="grab" aria-hidden="true"></div>'}${html}</div>`;
  if (!opts.locked) enableDrag(root.querySelector('.sheet'));
  sheetState = opts;
  root.hidden = false;
  document.body.classList.add('locked');
  requestAnimationFrame(() => requestAnimationFrame(() => root.classList.add('open')));
}
function closeSheet() {
  const root = $('#sheet-root');
  root.classList.remove('open');
  document.body.classList.remove('locked');
  sheetState = null;
  setTimeout(() => { if (!root.classList.contains('open')) { root.hidden = true; root.innerHTML = ''; } }, 260);
}
function sheetHead(title, right = '') { return `<div class="sheet-head drag-zone"><h2 class="sheet-title">${title}</h2>${right}</div>`; }
function enableDrag(sheet) {
  let y0 = null, dy = 0, t0 = 0;
  sheet.addEventListener('pointerdown', e => {
    if (!e.target.closest('.grab,.drag-zone') || e.target.closest('button,input,select')) return;
    y0 = e.clientY; t0 = performance.now(); dy = 0; sheet.style.transition = 'none';
    try { sheet.setPointerCapture(e.pointerId); } catch (err) {}
  });
  sheet.addEventListener('pointermove', e => {
    if (y0 === null) return;
    dy = Math.max(0, e.clientY - y0); sheet.style.transform = `translateY(${dy}px)`;
  });
  const end = () => {
    if (y0 === null) return;
    const v = dy / Math.max(1, performance.now() - t0); y0 = null;
    sheet.style.transition = ''; sheet.style.transform = '';
    if (dy > 110 || (v > .6 && dy > 30)) closeSheet();
  };
  sheet.addEventListener('pointerup', end); sheet.addEventListener('pointercancel', end);
}
function confirmSheet(title, body, okLabel, onOk) {
  openSheet(`${sheetHead(esc(title))}<p>${body}</p><div class="btns"><button class="btn btn-danger" data-act="confirmOk">${esc(okLabel)}</button><button class="btn btn-ghost" data-act="closeSheet">Cancel</button></div>`, { onOk });
}

    qa = { left, mode, amt: '', cat: null, wallet: S.lastWallet[mode] && wal(S.lastWallet[mode]) && !wal(S.lastWallet[mode]).archived ? S.lastWallet[mode] : activeWallets()[0]?.id, to: null, note: '', date: t, editId: null };
  }

  openSheet(qaHtml(), { qa: true });

function quickPicks() {
  if (qa.mode === 'xfer' || qa.editId) return [];
  const since = addDays(today(), -90), m = new Map();
  for (const t of sortTx(S.txs.filter(t => t.type === qa.mode && t.note && t.date >= since && !t.billId))) {
    const k = [t.cat, t.wallet, t.note.toLowerCase()].join('|');
    const e = m.get(k);
    if (e) e.n++; else m.set(k, { n: 1, t });
  }
  return [...m.values()].filter(e => e.n >= 2).sort((a, b) => b.n - a.n).slice(0, 8).map(e => e.t);
}

/* ---------- backup ---------- */
async function shareOrDownload(name, type, text) {
  const blob = new Blob([text], { type });
  const file = new File([blob], name, { type });
  try {
    if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], title: name }); return true; }
  } catch (e) { if (e && e.name === 'AbortError') return false; }
  try {
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a'); a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 4000);
    return true;
  } catch (e) { toast('Exporting isn\'t available here.'); return false; }
}
async function doBackup() {
  const name = `pondo-backup-${today()}.json`;
  const ok = await shareOrDownload(name, 'application/json', exportData());
  if (ok) { S.lastBackup = Date.now(); commit(); toast('Backup created. Save it to Files or iCloud Drive.'); }
}
async function doCSV() {
  const q = v => { const s = String(v ?? ''); return /[",\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s; };
  const rows = [['Date','Type','Amount','Currency','Category','Wallet','To wallet','Note']];
  for (const t of sortTx([...S.txs])) rows.push([t.date, typeLabel(t), signedAmt(t), S.currency, t.cat ? cat(t.cat)?.name : '', wname(t.wallet), t.to ? wname(t.to) : '', t.note]);
  await shareOrDownload(`pondo-${today()}.csv`, 'text/csv', rows.map(r => r.map(q).join(',')).join('\n'));
}
$('#restore-file').addEventListener('change', e => {
  const f = e.target.files[0]; e.target.value = '';
  if (!f) return;
  const r = new FileReader();
  r.onload = () => {
    let obj;
    try { obj = JSON.parse(r.result); } catch (err) { toast('That file isn\'t a Pondo backup.'); return; }
    if (!obj || obj.app !== 'pondo' || !obj.data || !Array.isArray(obj.data.txs)) { toast('That file isn\'t a Pondo backup.'); return; }
    confirmSheet('Restore this backup?', `It has ${plural(obj.data.txs.length, 'transaction')}, saved ${esc(new Date(obj.exported).toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric' }))}. Everything currently on this phone will be replaced.`, 'Replace and restore', () => {
      const keepSync = S?.sync || null; S = migrate(obj.data); S.sync = keepSync; S.onboarded = true; S.sample = false; ui.tab = 'home'; commit(); toast('Backup restored');
    });
  };
  r.readAsText(f);
});

/* ---------- toast ---------- */
let toastTimer;
function toast(msg, undo) {
  const el = $('#toast'), b = $('#toast-undo');
  $('#toast-msg').textContent = msg;
  b.hidden = !undo;
  b.onclick = () => { el.classList.remove('show'); undo && undo(); };
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), undo ? 5000 : 2600);
}

function sampleState() {

  const T = today(), start = addDays(T, -150);
  s.bills = [
    { id: 'rent', name: 'Rent', amt: 800000, day: 5, cat: 'bills', wallet: 'bank' },
    { id: 'power', name: 'Electricity', amt: 235000, day: 12, cat: 'bills', wallet: 'bank' },
    { id: 'net', name: 'Home internet', amt: 169900, day: 20, cat: 'bills', wallet: 'bank' },
    { id: 'phone', name: 'Phone plan', amt: 59900, day: 29, cat: 'load', wallet: 'gcash' }
  ].map(b => ({ ...b, paid: {}, since: start }));
  let ts = 1;
  const HOURS = { Jeep: 7.5, Coffee: 15, Lunch: 12.2, Grab: 18.5, Groceries: 10.5, Salary: 9, Savings: 9.2, 'Cash in': 9.1, 'Padala kay Mama': 9.4, Withdraw: 8.2, Pharmacy: 19, 'Data promo': 21, Movie: 19.5, 'Dinner out': 19.8, Karaoke: 21.5, Commission: 16, Shopee: 22, Lazada: 22.3, Clothes: 17 };

  const add = (date, type, amt, cat, wallet, note, extra = {}) => { const t = { id: uid(), type, amt: Math.round(amt * 100), cat, wallet, to: null, note, date, ts: at(date, HOURS[note.split(':')[0]] ?? HOURS[note] ?? 13), ...extra }; s.txs.push(t); return t; };
  for (let d = start; d <= T; d = addDays(d, 1)) {

    const isToday = d === T;

    if (s.schedule.days.some(p => Math.min(p, last) === dom) && !isToday) {

      add(d, 'xfer', 6000, null, 'bank', 'Cash in', { to: 'gcash' });
      add(d, 'xfer', 3000, null, 'bank', 'Savings', { to: 'savings' });
      add(d, 'exp', 2000, 'family', 'bank', 'Padala kay Mama');
    }
    if (dow === 1 && !isToday) add(d, 'xfer', 1200, null, 'gcash', 'Withdraw', { to: 'cash' });

    if (dow >= 1 && dow <= 5) { if (rnd() < .8) add(d, 'exp', r(26, 30) * 2, 'transport', 'cash', 'Jeep'); else add(d, 'exp', r(180, 320), 'transport', 'gcash', 'Grab'); }
    if (dow === 6) add(d, 'exp', r(1200, 1800), 'groceries', 'bank', 'Groceries');
    if (rnd() < .11) add(d, 'exp', r(300, 1300), 'shopping', 'gcash', ['Shopee','Lazada','Clothes'][r(0, 2)]);
    if ((dow === 0 || dow === 6) && rnd() < .5) add(d, 'exp', r(250, 800), 'fun', 'bank', ['Movie','Dinner out','Karaoke'][r(0, 2)]);
    if (rnd() < .03) add(d, 'exp', r(150, 600), 'health', 'cash', 'Pharmacy');
    if (dom === 3) add(d, 'exp', 99, 'load', 'gcash', 'Data promo');
    if (rnd() < .04) add(d, 'inc', r(800, 2500), 'freelance', 'gcash', 'Commission');
  }
  // a few utang so the tab has something in it
  const dd = (n) => addDays(T, -n);
  const grab = uid();
  add(dd(2), 'exp', 180, 'transport', 'gcash', 'Grab to BGC');
  add(dd(2), 'debt', 360, null, 'gcash', 'Covered for Mia, Jo: Grab to BGC', { dir: 'out', debtGroup: grab });
  const mia = { id: uid(), person: 'Mia', dir: 'owed', amt: 18000, kind: 'split', note: 'Grab to BGC', date: dd(2), cat: 'transport', paid: [], ts: at(dd(2), 18.6), group: grab };
  const jo = { id: uid(), person: 'Jo', dir: 'owed', amt: 18000, kind: 'split', note: 'Grab to BGC', date: dd(2), cat: 'transport', paid: [], ts: at(dd(2), 18.6), group: grab };
  const joPay = add(dd(1), 'debt', 180, null, 'gcash', 'Jo paid you back: Grab to BGC', { dir: 'in', debtId: jo.id });
  jo.paid.push({ id: uid(), amt: 18000, date: dd(1), txId: joPay.id });
  const carlo = { id: uid(), person: 'Carlo', dir: 'owed', amt: 100000, kind: 'cash', note: 'Pang-load and pamasahe', date: dd(18), paid: [], ts: at(dd(18), 20) };
  const cOut = add(dd(18), 'debt', 1000, null, 'cash', 'Lent to Carlo: Pang-load and pamasahe', { dir: 'out', debtId: carlo.id }); carlo.txId = cOut.id;
  const cPay = add(dd(9), 'debt', 400, null, 'cash', 'Carlo paid you back', { dir: 'in', debtId: carlo.id });
  carlo.paid.push({ id: uid(), amt: 40000, date: dd(9), txId: cPay.id });
  const miaLunch = { id: uid(), person: 'Mia', dir: 'owe', amt: 22000, kind: 'split', note: 'Samgyup lunch', date: dd(1), cat: 'food', paid: [], ts: at(dd(1), 12.5) };
  s.debts = [mia, jo, carlo, miaLunch];
  // a weekend trip, tagged
  const trip = dd(24);
  add(trip, 'exp', 520, 'transport', 'gcash', 'Bus to Baguio #Baguio');
  add(trip, 'exp', 60, 'food', 'cash', 'Strawberry taho #Baguio');
  add(addDays(trip, 1), 'exp', 850, 'shopping', 'cash', 'Ukay finds #Baguio');
  add(addDays(trip, 1), 'exp', 640, 'shopping', 'cash', 'Pasalubong #Baguio');
  add(addDays(trip, 1), 'exp', 380, 'food', 'gcash', 'Dinner at Session Road #Baguio');
  // goals and yearly costs, kept in Savings
  const due = ymd(new Date(todayD().getFullYear() + (todayD().getMonth() >= 2 ? 1 : 0), 2, 31));
  const laptop = { id: uid(), kind: 'goal', name: 'Laptop for school', icon: '💻', target: 3500000, due, keepIn: 'savings', adds: [] };
  const xmas = { id: uid(), kind: 'yearly', name: 'Christmas gifts', icon: '🎄', target: 800000, month: 12, day: 20, keepIn: 'savings', adds: [] };
  [[60, 400000, laptop], [45, 400000, laptop], [15, 400000, laptop], [40, 200000, xmas], [12, 150000, xmas]].forEach(([n, amt, p]) => {
    const t = add(dd(n), 'xfer', amt / 100, null, 'bank', `For ${p.name}`, { to: 'savings', potId: p.id });
    p.adds.push({ id: uid(), amt, date: dd(n), txId: t.id, kind: 'add' });
  });
  s.pots = [laptop, xmas];
  // an index fund bought once a month, with a regular investing plan
  const keepS = S; S = s; const cyc = ymd(prevPayday()); S = keepS;
  const fund = { id: uid(), kind: 'fund', code: 'Index fund', name: 'Sample PSEi index fund', price: 2.236, priceDate: dd(2), trades: [] };
  [[addDays(cyc, -61), 2.104], [addDays(cyc, -30), 2.051], [cyc, 2.178]].forEach(([date, price]) => {
    const qty = Math.round(1000 / price * 10000) / 10000;
    const tr = { id: uid(), type: 'buy', date, qty, price, fees: 0, wallet: 'bank', ts: at(date, 9.5) };
    const t = add(date, 'inv', tradeCash(tr) / 100, null, 'bank', `Bought ${fmtQty(qty, 'fund')} Index fund`, { dir: 'out', invId: fund.id });
    tr.txId = t.id; fund.trades.push(tr);
  });
  s.holdings = [fund];
  s.investPlan = { amt: 100000, reserve: true };
  // choose starting balances so today's balances look like a real wallet the day before payday
  const target = { cash: 185000, gcash: 264000, bank: 492000, savings: 4600000 };
  const flow = { cash: 0, gcash: 0, bank: 0, savings: 0 };
  for (const t of s.txs) {
    if (t.type === 'exp') flow[t.wallet] -= t.amt; else if (t.type === 'inc') flow[t.wallet] += t.amt;
    else if (t.type === 'debt' || t.type === 'inv' || t.type === 'adj') flow[t.wallet] += t.dir === 'in' ? t.amt : -t.amt;
    else { flow[t.wallet] -= t.amt; flow[t.to] += t.amt; }
  }
  for (const id in target) W[id].start = target[id] - flow[id];
  return s;
}

/* ---------- boot ---------- */
if (!S && PREVIEW) { S = sampleState(); persist(); }
if (S && postInstallments()) persist();
render();
if (S && S.openAddOnLaunch && !sheetState) openQA();
setTimeout(() => { try { maybeAutoSync(); } catch (e) {} }, 1500);
window.addEventListener('online', () => { try { maybeAutoSync(); } catch (e) {} });
if (!PREVIEW && 'serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}
})();
</script>
